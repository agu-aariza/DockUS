name: DockUS CI

on:
  push:
    branches: [main, "feature/*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "README.md"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, "feature/*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "README.md"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"

jobs:
  frontend-verify:
    name: Frontend Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  backend-verify:
    name: Backend Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dockus
          POSTGRES_PASSWORD: dockus_secure_pass
          POSTGRES_DB: dockus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: dockus
      DB_PASSWORD: dockus_secure_pass
      DB_NAME: dockus_test
      JWT_SECRET: ci_test_jwt_secret_that_is_long_enough_12345
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_long_enough_12345
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Check architectural boundaries
        run: npm run boundaries

      - name: Typecheck backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run backend unit tests
        run: npm test -- --runInBand
