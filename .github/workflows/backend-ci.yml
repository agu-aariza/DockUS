name: DockUS CI

on:
  push:
    branches: [ main, 'feature/*' ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, 'feature/*' ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.env.example'
      - '.github/workflows/backend-ci.yml'

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-verify:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: dockus
      DB_PASSWORD: dockus_secure_pass
      DB_NAME: dockus_test
      JWT_SECRET: ci_test_jwt_secret
      JWT_EXPIRES_IN: 15m
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --runInBand
