# ============================================================================
# CI PIPELINE - BACKEND KERNEL VALIDATION
# ============================================================================
# 
# Workflow para la validación de integridad del backend.
# Ejecuta auditoría de dependencias, análisis estático, construcción y tests.
# ============================================================================

name: Backend CI

on:
  push:
    branches: [ main, 'feature/*' ]
    paths:
      - 'backend/**'
      - '.env.example'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, 'feature/*' ]
    paths:
      - 'backend/**'
      - '.env.example'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  validate-kernel:
    name: Backend Validation (Node.js 22)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dockus
          POSTGRES_PASSWORD: dockus_secure_pass
          POSTGRES_DB: dockus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dockus -d dockus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: dockus
      DB_PASSWORD: dockus_secure_pass
      DB_NAME: dockus_test
      JWT_SECRET: ci_test_jwt_secret
      JWT_EXPIRES_IN: 15m
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (CI)
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Build Application
        run: npm run build

      - name: Unit Tests
        run: npm run test

      - name: E2E Tests
        run: npm run test:e2e -- --runInBand
