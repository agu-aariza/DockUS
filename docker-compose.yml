services:
  postgres:
    image: postgres:16-alpine
    container_name: dockus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dockus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dockus_pass}
      POSTGRES_DB: ${DB_NAME:-dockus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockus-network

  redis:
    image: redis:7-alpine
    container_name: dockus-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-server --appendonly yes; else redis-server --requirepass $$REDIS_PASSWORD --appendonly yes; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockus-network

  minio:
    image: quay.io/minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: dockus-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dockus_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dockus_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set myminio http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready myminio >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dockus-network

  ollama:
    image: ollama/ollama:latest
    container_name: dockus-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      BUILDER_OLLAMA_MODEL: ${BUILDER_OLLAMA_MODEL:-deepseek-r1:7b}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - dockus-network

  ollama-bootstrap:
    image: node:22-alpine
    container_name: dockus-ollama-bootstrap
    restart: "no"
    working_dir: /app
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: ${BUILDER_OLLAMA_MODEL:-deepseek-r1:7b}
      PLAN_MODEL_NAME: ${BUILDER_OLLAMA_PLAN_MODEL:-dockus-builder-plan}
      EVAL_MODEL_NAME: ${BUILDER_OLLAMA_EVAL_MODEL:-dockus-builder-eval}
      PLAN_BASE_MODEL: ${PLAN_BASE_MODEL:-qwen2.5-coder:1.5b}
      EVAL_BASE_MODEL: ${EVAL_BASE_MODEL:-deepseek-r1:1.5b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-65536}
    volumes:
      - ./backend:/app
    command: sh -c "node /app/scripts/ollama-bootstrap.mjs"
    networks:
      - dockus-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    image: dockus-backend-dev
    container_name: dockus-backend
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      BUILDER_OLLAMA_BASE_URL: http://ollama:11434
      BUILDER_OLLAMA_TIMEOUT_MS: 600000
      DOCKER_HOST: unix:///var/run/docker.sock
      BUILDER_DOCKER_RUNTIME: ${BUILDER_DOCKER_RUNTIME:-runc}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "
      if [ ! -f node_modules/.package-lock.json ] || ! cmp -s package-lock.json node_modules/.package-lock.json; then
        npm install &&
        cp package-lock.json node_modules/.package-lock.json;
      fi &&
      npm run start:dev
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dockus-network

  backend-prod:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: dockus-backend-prod
    container_name: dockus-backend-prod
    restart: unless-stopped
    profiles: ["prod"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      DOCKER_HOST: unix:///var/run/docker.sock
      BUILDER_DOCKER_RUNTIME: ${BUILDER_DOCKER_RUNTIME:-runsc}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dockus-network

  frontend:
    image: node:22-alpine
    container_name: dockus-frontend
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "
      if [ ! -f node_modules/.package-lock.json ] || ! cmp -s package-lock.json node_modules/.package-lock.json; then
        npm install &&
        cp package-lock.json node_modules/.package-lock.json;
      fi &&
      npm run dev -- --host 0.0.0.0 --port 5173
      "
    networks:
      - dockus-network

  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    image: dockus-frontend-prod
    container_name: dockus-frontend-prod
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      backend-prod:
        condition: service_started
    ports:
      - "8080:80"
    networks:
      - dockus-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  dockus-network:
    driver: bridge
    name: dockus-network
