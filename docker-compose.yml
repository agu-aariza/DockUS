services:
  postgres:
    image: postgres:16-alpine
    container_name: dockus-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dockus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dockus_secure_pass}
      POSTGRES_DB: ${DB_NAME:-dockus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dockus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockus-network

  redis:
    image: redis:7-alpine
    container_name: dockus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-server --appendonly yes; else redis-server --requirepass $$REDIS_PASSWORD --appendonly yes; fi"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockus-network

  minio:
    image: quay.io/minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: dockus-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dockus_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dockus_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set myminio http://localhost:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready myminio >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dockus-network

  ollama:
    image: ollama/ollama:latest
    container_name: dockus-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      BUILDER_OLLAMA_MODEL: ${BUILDER_OLLAMA_MODEL:-qwen2.5-coder:7b}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - dockus-network

  ollama-pull:
    image: ollama/ollama:latest
    container_name: dockus-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${BUILDER_OLLAMA_MODEL:-qwen2.5-coder:7b}"]
    networks:
      - dockus-network

  backend:
    image: node:22-alpine
    container_name: dockus-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      BUILDER_OLLAMA_BASE_URL: http://ollama:11434
      BUILDER_OLLAMA_TIMEOUT_MS: 600000
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "command -v docker >/dev/null || apk add --no-cache docker-cli docker-cli-buildx curl; command -v kubectl >/dev/null || (curl -sLo /usr/local/bin/kubectl https://dl.k8s.io/release/stable/bin/linux/amd64/kubectl && chmod +x /usr/local/bin/kubectl); command -v kind >/dev/null || (curl -sLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 && chmod +x /usr/local/bin/kind); docker network connect kind dockus-backend 2>/dev/null || true; mkdir -p ~/.kube && kind get kubeconfig --name dockus-builder --internal > ~/.kube/config 2>/dev/null || true; [ -f node_modules/.package-lock.json ] && npm run start:dev || (npm install && npm run start:dev)"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dockus-network

  frontend:
    image: node:22-alpine
    container_name: dockus-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "[ -f node_modules/.package-lock.json ] && npm run dev -- --host 0.0.0.0 --port 5173 || (npm install && npm run dev -- --host 0.0.0.0 --port 5173)"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dockus-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  dockus-network:
    driver: bridge
    name: dockus-network
