services:
  postgres:
    image: postgres:16-alpine
    container_name: dockus-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dockus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockus_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dockus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockus-network

  redis:
    image: redis:7-alpine
    container_name: dockus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockus-network

  minio:
    image: minio/minio:latest
    container_name: dockus-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dockus_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dockus_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dockus-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  dockus-network:
    driver: bridge
    name: dockus-network
