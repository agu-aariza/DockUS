services:
  postgres:
    image: postgres:16.4-alpine
    container_name: educodeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-educodeai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-educodeai_pass}
      POSTGRES_DB: ${DB_NAME:-educodeai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educodeai-network

  redis:
    image: redis:7.4-alpine
    container_name: educodeai-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes;
      else
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -z "$$REDIS_PASSWORD" ]; then redis-cli ping; else redis-cli -a "$$REDIS_PASSWORD" ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educodeai-network

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: educodeai-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-educodeai_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-educodeai_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set myminio http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready myminio >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - educodeai-network

  minio-init:
    image: quay.io/minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: educodeai-minio-init
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-educodeai_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-educodeai_secret_key}
      STORAGE_EVIDENCE_RETENTION_DAYS: ${STORAGE_EVIDENCE_RETENTION_DAYS:-90}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu;
        mc alias set educodeai http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null;
        lifecycle_rules_file=/tmp/educodeai-lifecycle-rules.json;
        lifecycle_rule_found=false;
        mc ilm rule ls --json educodeai/educodeai-storage >"$$lifecycle_rules_file" 2>/dev/null || true;
        while IFS= read -r lifecycle_rule; do
          case "$$lifecycle_rule" in *runs/*Enabled*) lifecycle_rule_found=true ;; esac
        done <"$$lifecycle_rules_file";
        if [ "$$lifecycle_rule_found" != "true" ]; then
          mc ilm rule add educodeai/educodeai-storage --prefix "runs/" --expire-days "$$STORAGE_EVIDENCE_RETENTION_DAYS";
        fi
    networks:
      - educodeai-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
      target: dev
    image: educodeai-backend:dev
    container_name: educodeai-backend
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_SYNCHRONIZE: "false"
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_API_PORT: ${MINIO_API_PORT:-9000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # DOCKER_HOST se hereda del .env raíz. La API no requiere socket directo;
      # la gestión de contenedores se ejecuta exclusivamente en el worker.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # @educodeai/contracts es un symlink a /shared/contracts: sin este bind, un
      # cambio en el contrato compartido solo se ve reconstruyendo la imagen.
      - ./shared:/shared:ro
      # El socket de Docker no se monta en la API HTTP. La comprobación de salud
      # consulta el estado publicado en Redis por el worker.
      - /tmp:/tmp
    # `backend` y `worker` comparten el volumen `backend_node_modules`. Sin el
    # cerrojo ambos arrancan a la vez y lanzan `npm install` sobre el mismo
    # arbol: uno deja `.bin/` a medio enlazar y el otro muere con EEXIST al
    # crear el symlink de @educodeai/contracts. El sintoma final no es el error de
    # npm sino `sh: nest: Permission denied` en el arranque siguiente, porque
    # los binarios quedan sin bit de ejecucion.
    #
    # El testigo NO puede llamarse `.package-lock.json`: ese nombre lo usa npm
    # para su propia cache del arbol instalado, y sobrescribirlo la corrompe.
    command: >
      sh -c '
        set -e;
        flock /app/node_modules/.educodeai-install.lock sh -c "
          if ! cmp -s package-lock.json node_modules/.educodeai-install.stamp; then
            npm install --legacy-peer-deps &&
            cp package-lock.json node_modules/.educodeai-install.stamp;
          fi
        ";
        npm run start:dev
      '
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Un volumen de dependencias frio obliga a un `npm install` completo antes
      # de escuchar en el puerto. Con 45s el contenedor se marcaba unhealthy a
      # mitad de instalacion y `frontend`, que espera a que este sano, abortaba
      # con "dependency failed to start". Solo alarga la ventana de arranque en
      # frio: el primer sondeo correcto lo marca sano de inmediato.
      start_period: 300s
    networks:
      - educodeai-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
      target: dev
    image: educodeai-backend:dev
    container_name: educodeai-worker
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_SYNCHRONIZE: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_API_PORT: ${MINIO_API_PORT:-9000}
      DOCKER_HOST: unix:///var/run/docker.sock
      BUILDER_DOCKER_RUNTIME: ${BUILDER_DOCKER_RUNTIME:-runc}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Raiz de los workspaces de evaluacion. `os.tmpdir`
      # respeta TMPDIR, de modo que fijarlo aqui reubica tanto los workspaces
      # como los contextos de build de imagen sin tocar codigo.
      #
      # La ruta tiene que ser LA MISMA dentro y fuera del contenedor. El worker
      # no ejecuta el codigo del alumno: le pide al demonio del anfitrion que
      # levante un contenedor montando `<workspace>/project:/app`, y el demonio
      # resuelve esa ruta contra el sistema de ficheros del ANFITRION, no contra
      # el del worker. Con el `/tmp` en tmpfs privado que habia aqui, esa ruta
      # no existia fuera del contenedor y Docker montaba un directorio vacio:
      # el contenedor de ejecucion recibia `/app` sin el codigo del alumno.
      TMPDIR: /educodeai-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # @educodeai/contracts es un symlink a /shared/contracts: sin este bind, un
      # cambio en el contrato compartido solo se ve reconstruyendo la imagen.
      - ./shared:/shared:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Ruta identica a ambos lados: es lo que hace resoluble el bind mount que
      # el worker solicita al demonio. Vease TMPDIR arriba.
      - /educodeai-workspaces:/educodeai-workspaces
      # El tmpfs se conserva para lo que SI es local al proceso (el fichero de
      # heartbeat que lee el healthcheck), que no necesita verse desde fuera.
      #
      # apuntaba a este tmpfs: los workspaces vivian aqui, es decir
      # sobre RAM del anfitrion, y cinco runs concurrentes se acercaban al cap
      # de 2G llevandose al worker entero por ENOSPC/OOM. Al mover TMPDIR a
      # /educodeai-workspaces (disco) por ese riesgo desaparecio: hoy
      # aqui solo vive el heartbeat, del orden de kilobytes. Lo que queda del
      # hallazgo es la RAM de los contenedores de ejecucion, sobre la que el
      # worker avisa al arrancar si concurrencia x limite se acerca al total.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2G
    # Mismo cerrojo que en `backend`: los dos servicios escriben en el mismo
    # volumen de dependencias y arrancan en paralelo. Quien llega primero
    # instala; el otro espera y se encuentra el arbol ya completo.
    command: >
      sh -c '
        set -e;
        flock /app/node_modules/.educodeai-install.lock sh -c "
          if ! cmp -s package-lock.json node_modules/.educodeai-install.stamp; then
            npm install --legacy-peer-deps &&
            cp package-lock.json node_modules/.educodeai-install.stamp;
          fi
        ";
        npm run start:worker:dev
      '
    healthcheck:
      # El worker refresca /tmp/educodeai-worker.heartbeat cada 10s. Se considera
      # sano si el fichero se ha tocado en los últimos 60s: un proceso colgado o
      # en crash-loop deja de refrescarlo y el healthcheck pasa a unhealthy.
      test:
        [
          "CMD-SHELL",
          "test $(( $(date +%s) - $(stat -c %Y /tmp/educodeai-worker.heartbeat 2>/dev/null || echo 0) )) -lt 60",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      # Puede quedarse esperando el cerrojo mientras `backend` instala, asi que
      # necesita al menos la misma ventana en frio (vease `backend`).
      start_period: 300s
    networks:
      - educodeai-network

  backend-prod:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: production
    image: educodeai-backend:prod
    container_name: educodeai-backend-prod
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "false"
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_API_PORT: ${MINIO_API_PORT:-9000}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # DOCKER_HOST llega heredado del .env raiz (env_file) y es obligatorio
      # en produccion segun env.validation.ts (NODE_ENV, no el rol del
      # proceso) — pero inerte aqui: sin el mount de docker.sock retirado mas
      # abajo, nada en la API puede usarlo. Ver el comentario equivalente en
      # el servicio `backend` (mas arriba) para los dos intentos de quitarlo
      # que se probaron y descartaron.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # La API en producción no requiere socket de Docker directo; la salud del daemon
    # se consulta a través del estado publicado en Redis por el worker.
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - educodeai-network

  worker-prod:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: production
    image: educodeai-backend:prod
    container_name: educodeai-worker-prod
    restart: unless-stopped
    profiles: ["prod"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_API_PORT: ${MINIO_API_PORT:-9000}
      DOCKER_HOST: unix:///var/run/docker.sock
      BUILDER_DOCKER_RUNTIME: ${BUILDER_DOCKER_RUNTIME:-runc}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Vease el servicio `worker` de dev: la ruta de los workspaces debe ser
      # identica dentro y fuera del contenedor para que el demonio del anfitrion
      # pueda resolver el bind mount del codigo del alumno.
      TMPDIR: /educodeai-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /educodeai-workspaces:/educodeai-workspaces
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2G
    group_add:
      - ${DOCKER_HOST_GID:-999}
    command: ["node", "dist/worker"]
    healthcheck:
      # Frescura del heartbeat del worker (véase el servicio `worker` de dev).
      test:
        [
          "CMD-SHELL",
          "test $(( $(date +%s) - $(stat -c %Y /tmp/educodeai-worker.heartbeat 2>/dev/null || echo 0) )) -lt 60",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - educodeai-network

  frontend:
    image: node:22-alpine
    container_name: educodeai-frontend
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./shared:/shared:ro
    # Un solo servicio escribe en `frontend_node_modules`, asi que aqui no hace
    # falta cerrojo; el testigo si se renombra por el mismo motivo que en
    # `backend`: `.package-lock.json` es un fichero interno de npm.
    command: >
      sh -c '
        set -e;
        if ! cmp -s package-lock.json node_modules/.educodeai-install.stamp; then
          npm install --legacy-peer-deps;
          cp package-lock.json node_modules/.educodeai-install.stamp;
        fi;
        npm run dev -- --host 0.0.0.0 --port 5173
      '
    healthcheck:
      # 127.0.0.1 y no `localhost`: Vite escucha solo en IPv4 (0.0.0.0:5173),
      # pero /etc/hosts resuelve `localhost` tambien a ::1 y el wget de busybox
      # prefiere IPv6, con lo que el sondeo moria con "connection refused"
      # mientras el servidor atendia peticiones con normalidad desde fuera.
      # El backend no sufre esto porque Nest abre el puerto en dual-stack (:::3000).
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Comparte causa con `backend`: el arranque en frio incluye un npm install
      # completo, que no cabe en 30s.
      start_period: 300s
    networks:
      - educodeai-network

  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    image: educodeai-frontend:prod
    container_name: educodeai-frontend-prod
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - educodeai-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  educodeai-network:
    driver: bridge
    name: educodeai-network
